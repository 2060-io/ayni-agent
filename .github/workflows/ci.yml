name: Continuous Integration

on:
  pull_request:
    branches: [main, 'v[0-9]*']
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main, 'v[0-9]*']
  workflow_dispatch:

# Cancel superseded runs on the same branch/PR to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # Reusable 2060 pipeline: build + format + types + unit/integration/e2e tests,
  # PR-title (conventional commits) validation and Helm chart linting.
  ci:
    uses: 2060-io/organization/.github/workflows/2060-linter-call.yml@562f890be78c7fd3f07695446f4506d383c52219 # v0.5.2
    with:
      enable-charts-lint: true

  # Validate the Docker image builds on every PR/push (without pushing it).
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The reference relational store (PostgreSQL with pgvector): the scope predicate compiled for each store, the
  # migrations, no plaintext beside the ciphertext (PRIV-SCOPE-003, MEM-RAG-005, PRIV-ERASE-001).
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js v24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build the profile package
        run: pnpm --filter @ayni.org/ayni-agui-profile build

      - name: Test against PostgreSQL
        run: pnpm exec vitest run tests/postgres.test.ts
        env:
          PG_TEST_URL: postgres://postgres:postgres@localhost:5432/postgres
