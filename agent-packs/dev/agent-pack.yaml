# Development pack: offline stub model and embeddings, no keys. Used by `pnpm dev` and the tests.
schemaVersion: "3.0"

metadata:
  id: ayni-dev
  displayName: ${AGENT_DISPLAY_NAME:-Ayni Agent (dev)}
  description: Development instance of the Ayni Agent.

identity:
  homeBackingIdentity: ${HOME_BACKING_IDENTITY:-did:webvh:QmPk9gWBYyz93N8odMFuTpSS1yMPJhPpKynNwQw1oxjiqf:moonlit-trowel-unedited.ngrok-free.dev}
  userAgentGate: ${USER_AGENT_GATE:-optional}
  # home is the organization of this agent's own Organization credential, and no other (D64): nothing to list.
  # No authentication here: everyone enters unidentified (D53). To authenticate persons, enable methods and list the
  # combinations accepted (D125), asked at connection or later:
  #   authentication:
  #     request: on-demand          # on-connect (default): identified or refused
  #     methods:
  #       badge: { type: credential, credential: { jsonSchemaCredentialId: <the network's badge schema> },
  #                subjectKey: [badgeNumber] }
  #     combinations: [[badge]]
  roles:
    employee: { description: Any verified home employee. }
    # no role reads other people's conversations: a role carries no scope of conversation reads (RBAC-XSESS-005)
    manager: { description: Approves sensitive actions., canApprove: true }
    support: { description: Support operators. }
    # the admin interface's roles (RBAC-XSESS-008), given by the user directory and read by nothing else
    auditor: { description: Reads what the admin interface serves. }
    operator: { description: Erases entries and sets legal hold through the admin interface. }
    guest: { description: Authenticated peers without a recognized backing identity. }
  roleRules:
    - when: { relation: home, claims: { title: Manager } }
      roles: [employee, manager]
    - when: { relation: home }
      roles: [employee]
    - when: { relation: unrecognized }
      roles: [guest]

language:
  agent: en

persona:
  systemPrompt: |
    You are the Ayni Agent development assistant. Be brief.
  greeting: "Hello {userName}, this is the development agent. Ask me anything; try the echo tool."
  menu:
    - id: help
      label: Help
      action: { type: prompt, prompt: "What can you do?" }
      visibleWhen: bound
    - id: site
      label: Project
      action: { type: url, url: https://github.com/2060-io/ayni-agent }

llm:
  # LLM_PROVIDER=openai-compatible LLM_MODEL=kimi-k3 LLM_BASE_URL=https://api.moonshot.ai/v1 LLM_API_KEY=... for Kimi
  provider: ${LLM_PROVIDER:-stub}
  model: ${LLM_MODEL:-echo}
  apiKeyEnv: LLM_API_KEY
  maxOutputTokens: 2048
  multimodal: ${LLM_MULTIMODAL:-false}
  # the conversation is the provider's cache key (LLM-CACHE-001); the stub model simulates the cache
  cache:
    enabled: true

embeddings:
  provider: stub
  model: hash

memory:
  contextWindowTokens: 4000

rag:
  enabled: true
  sources:
    - id: notes
      type: local
      path: ./knowledge
      visibility: public

# the tool catalog (ayni-spec D101): one entry per source, keyed by its id; an HTTP tool is one tool, named by its id
tools:
  sources:
    echo:
      type: http
      description: Echoes the given text through a public HTTP echo service.
      method: POST
      url: https://httpbin.org/post
      parameters:
        type: object
        required: [text]
        properties:
          text: { type: string }
      access:
        roles:
          employee: [echo]
          guest: [echo]
          support: ["*"]
    wire_money:
      type: http
      description: Transfers money (development stand-in for a sensitive action).
      method: POST
      url: https://httpbin.org/post
      parameters:
        type: object
        properties:
          amount: { type: number }
      access:
        roles:
          employee: [wire_money]
          support: ["*"]
        approval:
          - tools: [wire_money]
            approvers: [manager]
            timeoutMinutes: 30
        elevation:
          - tools: [wire_money]
            purposes: [support-case]
            approvers: [manager]
            grantTtlMinutes: 60
      tools:
        wire_money:
          stepUp:
            authChallenge: { type: device, onChannelUnavailable: "${DEV_CHALLENGE_FALLBACK:-degrade}" }
            maxCredentialAge: 0
    principalCredentials: { type: bundled, bundled: principalCredentials }
    principalPreferences: { type: bundled, bundled: principalPreferences }
    workingMemory: { type: bundled, bundled: workingMemory }

purposes:
  - id: support-case
    label: Support case handling

approvals:
  timeoutMinutes: 30
  policy: { type: count, value: 1 }
  selfApproval: true

sessions:
  idleTimeoutSeconds: ${SESSION_IDLE_TIMEOUT_SECONDS:-1800}
  bindingExpirySeconds: ${BINDING_EXPIRY_SECONDS:-300}
  credentialCheckTtlSeconds: 300
  siblingSessions: true

channels:
  agui:
    enabled: true
    allowedOrigins: ["${AGUI_ALLOWED_ORIGINS:-http://localhost:5173}"]
    walletLinkTemplate: https://hologram.zone/open?oob={oob}
    uploads:
      maxBytes: 26214400
      types: ["image/*", "audio/webm", "audio/ogg", "audio/mp4", "application/pdf"]
  a2a:
    enabled: true

# a person deletes their own message, with the reply to it, for this long (decision 60)
conversations:
  messageDeletionWindowSeconds: ${MESSAGE_DELETION_WINDOW_SECONDS:-600}

# the rules of Personal and the spaces people may create (SPACE-DEF-002/003); in development a guest may create a
# project
spaces:
  personal:
    retentionDays: ${RETENTION_HISTORY_DAYS:-365}
  templates:
    - id: project
      title: Project
      kind: team
      creators: [employee, guest]
      membership: { mode: list }
      rules:
        retentionDays: { default: 365, min: 1, max: 3650 }
        lawfulBasis: { default: contract, allowed: [contract, consent, legitimate-interest] }
        allowedProviders: { default: [stub, openai-compatible], allowed: [stub, openai-compatible, anthropic] }
        handover: { default: true, allowed: [true, false] }
    - id: sales
      title: Sales
      kind: team
      creators: [manager]
      membership: { mode: rule, rule: { department: Sales } }
      rules:
        retentionDays: { default: 730 }
        allowedProviders: { default: [stub, openai-compatible] }
        handover: { default: true }
    - id: organization
      title: Organization
      kind: organization
      creators: [manager]
      membership: { mode: rule, rule: { organization: true } }
      rules:
        lawfulBasis: { default: legitimate-interest }
        handover: { default: false, allowed: [false, true] }

privacy:
  processingActivities:
    - { id: conversation-memory, lawfulBasis: contract, retention: { days: 365, onExpiry: archive } }
    - { id: working-memory, lawfulBasis: contract }
    - { id: rag-corpus, lawfulBasis: legitimate-interest }
    - { id: media-objects, lawfulBasis: contract, retention: { days: 365, onExpiry: archive } }
    - { id: credential-presentations, lawfulBasis: contract }
    - { id: approvals, lawfulBasis: legitimate-interest }
  erasureRequests: true

media:
  speechToText:
    enabled: true
    provider: openai-compatible
    model: ${STT_MODEL:-stub}
    baseUrl: ${STT_BASE_URL:-http://localhost:9999/v1}
  vision:
    enabled: true
    provider: llm
    model: ${VISION_MODEL:-stub}

integrity:
  anchoring:
    enabled: ${ANCHORING_ENABLED:-false}
    batchIntervalSeconds: 600

features:
  rag: true
  imageGeneration: false
  anchoring: ${ANCHORING_ENABLED:-false}
