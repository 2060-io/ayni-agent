# Single-command local stack (PLAT-DEPLOY-002): the agent's relational store (pgvector), cache and
# object store. The DIDComm agent runs from ../vs-agent (it needs a public tunnel and a registry).
# Usage: docker compose -f dev/compose/docker-compose.yml up -d
services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ayni
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ayni}
      POSTGRES_DB: ayni
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - agent-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ayni"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - agent-redis:/data

  minio:
    image: minio/minio:latest
    pull_policy: missing
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-ayni}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-ayni-secret}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - agent-minio:/data

volumes:
  agent-postgres:
  agent-redis:
  agent-minio:
