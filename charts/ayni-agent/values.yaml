# Kubernetes namespace the resources are created in
namespace: ayni

replicaCount: 1

image:
  repository: io2060/ayni-agent
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
# resources are named after the application, not the chart
nameOverride: "ayni-agent"
fullnameOverride: ""
podAnnotations: {}
resources: {}

# Deployment values (see the spec's reference implementation profile, "Container configuration").
# Secrets come from `existingSecret` (keys named like the variables), never from values.
env:
  - name: PORT
    value: "3010"
  - name: LOG_LEVEL
    value: info
  - name: AGENT_PACK_PATH
    value: /app/agent-pack
  - name: PUBLIC_BASE_URL
    value: https://agent.example.com
  - name: VS_AGENT_ADMIN_URL
    value: http://127.0.0.1:3000
  - name: AGUI_ALLOWED_ORIGINS
    value: https://ui.example.com
  - name: OBJECT_STORE_ENDPOINT
    value: http://minio:9000
  - name: OBJECT_STORE_BUCKET
    value: ayni-agent

# Secret holding SESSION_TOKEN_SECRET, DATABASE_URL, REDIS_URL, OBJECT_STORE_ACCESS_KEY,
# OBJECT_STORE_SECRET_KEY, ENTRY_ENCRYPTION_KEY, LLM_API_KEY, EMBEDDINGS_API_KEY, ANCHOR_SIGNER_MNEMONIC...
existingSecret: ""

# The agent pack, one of: a pack shipped in the image (set AGENT_PACK_PATH to its directory, e.g.
# /app/agent-packs/welcome), an existing ConfigMap holding agent-pack.yaml (agentPackConfigMap), or
# the pack given inline here (agentPack); the two ConfigMap forms are mounted at /app/agent-pack.
agentPackConfigMap: ""
agentPack: ""

service:
  enabled: true
  type: ClusterIP
  port: 3010

# Public entry (the descriptor and the AG-UI endpoints). With a VS Agent on the same host, keep the
# paths narrow so the DID Document and DIDComm stay with the VS Agent.
ingress:
  enabled: false
  className: nginx
  clusterIssuer: letsencrypt-prod
  host: ""
  tlsSecret: "public.{{ .Values.ingress.host }}-cert"
  proxyBodySize: 30m
  annotations: {}
  paths:
    - path: /
      pathType: Prefix

nodeSelector: {}
tolerations: []
affinity: {}
